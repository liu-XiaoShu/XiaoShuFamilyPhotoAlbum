version: "3.3"

services:
  album:
    build: .
    image: xiaoshu-album:latest
    container_name: xiaoshu-album
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./album:/app/album
      - ./inbox:/app/inbox
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      - TZ=Asia/Shanghai
      - HOST_UID=1001
      - HOST_GID=1001
