<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>超级用户登录 · 小树时光相册</title>
  <link rel="stylesheet" href="/styles.css?v=2.0.0" />
  <link rel="icon" href="/api/brand/icon" type="image/svg+xml" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("xiaoshu_theme") || "fresh";
        if (t !== "fresh" && t !== "cyber") t = "fresh";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body class="login-page">
  <div class="grid-bg" aria-hidden="true"></div>
  <main class="login-shell">
    <div class="login-brand" id="brand-block">
      <img id="login-brand-icon" class="brand-mark brand-mark-lg" src="/api/brand/icon" alt="" width="72" height="72" />
      <div>
        <h1 id="login-brand-title">小树时光相册</h1>
        <p class="tagline">超级用户登录</p>
      </div>
    </div>

    <section class="login-card" id="login-card">
      <h2 id="login-heading">登录</h2>
      <p class="hint" id="login-hint">登录后可管理设置、分享与回收站。</p>

      <form id="login-form" class="auth-form" autocomplete="on">
        <label class="field">
          <span class="field-label">用户名</span>
          <input type="text" id="login-user" name="username" maxlength="32" autocomplete="username" required />
        </label>
        <label class="field">
          <span class="field-label">密码</span>
          <div class="pw-wrap">
            <input type="password" id="login-pass" name="password" maxlength="64" autocomplete="current-password" required placeholder="请输入密码" />
            <button type="button" class="pw-toggle" data-for="login-pass" aria-label="显示密码" aria-pressed="false" title="显示密码">
                    <svg class="pw-eye pw-eye-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></svg>
                    <svg class="pw-eye pw-eye-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" hidden><path fill="currentColor" d="M2.1 3.51 3.5 2.1l18.4 18.4-1.41 1.41-3.13-3.13A12.3 12.3 0 0 1 12 19c-5 0-9.27-3.11-11-7a13.4 13.4 0 0 1 4.2-4.95L2.1 3.51zM12 7a5 5 0 0 1 4.9 4.05l-1.57-1.57A2.5 2.5 0 0 0 12.5 8.1L12 7zm0 10c1.1 0 2.14-.23 3.1-.64l-1.6-1.6A2.5 2.5 0 0 1 9.6 11.9l-1.7-1.7A5 5 0 0 0 12 17zM12 5c5 0 9.27 3.11 11 7a13.3 13.3 0 0 1-3.05 3.95l-1.45-1.45A11.2 11.2 0 0 0 21.1 12C19.5 8.7 16 7 12 7c-.55 0-1.08.05-1.6.14L8.9 5.64C9.87 5.23 10.92 5 12 5z"/></svg>
                  </button>
          </div>
        </label>
        <div id="setup-extra" class="hidden">
          <label class="field">
            <span class="field-label">确认密码</span>
            <div class="pw-wrap">
              <input type="password" id="login-pass2" maxlength="64" autocomplete="new-password" placeholder="再次输入密码" />
              <button type="button" class="pw-toggle" data-for="login-pass2" aria-label="显示密码" aria-pressed="false" title="显示密码">
                    <svg class="pw-eye pw-eye-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></svg>
                    <svg class="pw-eye pw-eye-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" hidden><path fill="currentColor" d="M2.1 3.51 3.5 2.1l18.4 18.4-1.41 1.41-3.13-3.13A12.3 12.3 0 0 1 12 19c-5 0-9.27-3.11-11-7a13.4 13.4 0 0 1 4.2-4.95L2.1 3.51zM12 7a5 5 0 0 1 4.9 4.05l-1.57-1.57A2.5 2.5 0 0 0 12.5 8.1L12 7zm0 10c1.1 0 2.14-.23 3.1-.64l-1.6-1.6A2.5 2.5 0 0 1 9.6 11.9l-1.7-1.7A5 5 0 0 0 12 17zM12 5c5 0 9.27 3.11 11 7a13.3 13.3 0 0 1-3.05 3.95l-1.45-1.45A11.2 11.2 0 0 0 21.1 12C19.5 8.7 16 7 12 7c-.55 0-1.08.05-1.6.14L8.9 5.64C9.87 5.23 10.92 5 12 5z"/></svg>
                  </button>
            </div>
          </label>
          <div class="pw-meter" aria-hidden="true"><i id="login-meter"></i></div>
          <ul class="pw-rules" id="login-rules">
            <li data-rule="len">至少 8 位</li>
            <li data-rule="classes">字母与数字（或符号）至少两类</li>
            <li data-rule="space">首尾无空格</li>
            <li data-rule="match">两次输入一致</li>
          </ul>
        </div>
        <button type="submit" class="btn primary login-submit" id="login-submit">登录</button>
        <p id="login-msg" class="muted" role="status"></p>
      </form>

      <p class="login-foot muted">
        忘记密码？在服务器上执行<br />
        <code>python run.py --reset-admin-password</code>
      </p>
    </section>
  </main>
  <script src="/login.js"></script>
</body>
</html>
